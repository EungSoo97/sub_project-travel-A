plugins {
    id 'java'
    id 'war'
}

group 'com.es'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    compileOnly('javax.servlet:javax.servlet-api:4.0.1')
    implementation 'org.apache.commons:commons-dbcp2:2.10.0'
    implementation 'com.oracle.database.jdbc:ojdbc8:21.11.0.0'
    implementation 'com.oracle.database.security:oraclepki:21.11.0.0'
    implementation 'com.oracle.database.security:osdt_core:21.11.0.0'
    implementation 'com.oracle.database.security:osdt_cert:21.11.0.0'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    implementation 'javax.servlet:jstl:1.2'
    implementation 'com.servlets:cos:09May2002'
    testImplementation("org.junit.jupiter:junit-jupiter-api:${junitVersion}")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:${junitVersion}")
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'org.apache.commons:commons-dbcp2:2.9.0'
    implementation 'com.oracle.database.jdbc:ojdbc8:19.22.0.0'

    implementation 'com.github.librepdf:openpdf:1.3.30'
    implementation 'org.xhtmlrenderer:flying-saucer-core:9.1.22'
    implementation 'org.xhtmlrenderer:flying-saucer-pdf-openpdf:9.1.22'
}

test {
    useJUnitPlatform()
}
